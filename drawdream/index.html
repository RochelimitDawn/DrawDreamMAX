<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/logo-icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf6f0" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('dd-theme') || 'system'
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var theme = dark ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.colorScheme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#161210' : '#faf6f0')
        } catch (e) {}
      })()
    </script>
    <title>DrawDream · 绘梦</title>
    <link rel="stylesheet" href="/fonts/dyh/SmileySans-Oblique/result.css" />
    <link rel="stylesheet" href="/fonts/stdgt/上图东观体-粗体/result.css" />
    <link rel="stylesheet" href="/fonts/keben/result.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
